name: Auto Release

on:
  push:
    branches:
      - main
  schedule:
    - cron: "17,47 * * * *"

permissions:
  contents: write
  packages: write

concurrency:
  group: auto-release
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      publish: ${{ steps.prepare.outputs.publish }}
      tag: ${{ steps.prepare.outputs.tag }}
    steps:
      - name: Checkout main
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - name: Prepare release
        id: prepare
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add upstream https://github.com/Wei-Shaw/sub2api.git
          git pull --ff-only origin main

          upstream_tag=$(gh api repos/Wei-Shaw/sub2api/releases/latest --jq .tag_name)
          if [[ ! "$upstream_tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid upstream release tag: $upstream_tag" >&2
            exit 1
          fi

          upstream_ref="refs/remotes/upstream-release/$upstream_tag"
          git fetch --force upstream "refs/tags/$upstream_tag:$upstream_ref"
          upstream_commit=$(git rev-parse "$upstream_ref^{}")

          latest_tag=""
          while IFS= read -r tag; do
            if [[ "$tag" =~ ^v0\.0\.[1-9][0-9]*$ ]]; then
              latest_tag=$tag
              break
            fi
          done < <(git tag --list 'v0.0.*' --sort=-v:refname)

          if [[ -n "$latest_tag" ]] && ! gh release view "$latest_tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Retrying missing release for $latest_tag"
            echo "publish=true" >> "$GITHUB_OUTPUT"
            echo "tag=$latest_tag" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [[ -n "$latest_tag" ]] && git merge-base --is-ancestor "$upstream_commit" "$latest_tag^{}"; then
            echo "Upstream release $upstream_tag was already published in $latest_tag"
            echo "publish=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if ! git merge-base --is-ancestor "$upstream_commit" HEAD; then
            git merge --no-edit "$upstream_commit"
          fi

          revision=1
          if [[ -n "$latest_tag" ]]; then
            revision=$((${latest_tag##*.} + 1))
          fi
          release_tag="v0.0.$revision"

          printf '%s\n' "${release_tag#v}" > backend/cmd/server/VERSION
          git add backend/cmd/server/VERSION
          if ! git diff --cached --quiet; then
            git commit -m "chore: release $release_tag [skip ci]"
          fi

          release_commit=$(git rev-parse HEAD)
          git tag -a "$release_tag" \
            -m "Sub2API $release_tag" \
            -m "Upstream-Release: $upstream_tag" \
            -m "Upstream-Commit: $upstream_commit" \
            -m "Project-Commit: $release_commit"
          git push --atomic origin HEAD:main "refs/tags/$release_tag"

          echo "publish=true" >> "$GITHUB_OUTPUT"
          echo "tag=$release_tag" >> "$GITHUB_OUTPUT"

  build-frontend:
    needs: prepare
    if: needs.prepare.outputs.publish == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout release
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.prepare.outputs.tag }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        working-directory: frontend

      - name: Build frontend
        run: pnpm run build
        working-directory: frontend

      - name: Upload frontend artifact
        uses: actions/upload-artifact@v7
        with:
          name: frontend-dist
          path: backend/internal/web/dist/
          retention-days: 1

  release:
    needs: [prepare, build-frontend]
    if: needs.prepare.outputs.publish == 'true' && needs.build-frontend.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout release
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.prepare.outputs.tag }}
          fetch-depth: 0

      - name: Verify release source
        env:
          TAG_NAME: ${{ needs.prepare.outputs.tag }}
        run: |
          [[ "$TAG_NAME" =~ ^v0\.0\.[1-9][0-9]*$ ]]
          test "$(tr -d '\r\n' < backend/cmd/server/VERSION)" = "${TAG_NAME#v}"
          grep -F 'githubRepo     = "${{ github.repository }}"' backend/internal/service/update_service.go

      - name: Download frontend artifact
        uses: actions/download-artifact@v8
        with:
          name: frontend-dist
          path: backend/internal/web/dist/

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: backend/go.mod
          check-latest: false
          cache-dependency-path: backend/go.sum

      - name: Verify Go version
        run: go version | grep -q 'go1.27.0'

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Read tag message
        id: tag_message
        env:
          TAG_NAME: ${{ needs.prepare.outputs.tag }}
        run: |
          message=$(git tag -l --format='%(contents)' "$TAG_NAME")
          {
            echo "message<<EOF"
            echo "$message"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Set lowercase owner
        id: lowercase
        run: echo "owner=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v7
        with:
          version: "~> v2"
          args: release --clean --skip=validate
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_MESSAGE: ${{ steps.tag_message.outputs.message }}
          GITHUB_REPO_OWNER: ${{ github.repository_owner }}
          GITHUB_REPO_OWNER_LOWER: ${{ steps.lowercase.outputs.owner }}
          GITHUB_REPO_NAME: ${{ github.event.repository.name }}
          GORELEASER_CURRENT_TAG: ${{ needs.prepare.outputs.tag }}
