name: Sync upstream and publish image

on:
  push:
    branches:
      - main
  schedule:
    - cron: "23 */2 * * *"
  workflow_dispatch:

permissions:
  contents: write
  packages: write

concurrency:
  group: sync-upstream-main
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/kodechicken/sub2api

jobs:
  sync-and-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Sync upstream main and tags
        id: sync
        if: github.event_name != 'push'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add upstream https://github.com/Wei-Shaw/sub2api.git

          before_commit=$(git rev-parse HEAD)
          before_tags=$(git tag --list | sort)
          git fetch upstream '+refs/heads/main:refs/remotes/upstream/main' --tags
          git merge --no-edit upstream/main
          after_commit=$(git rev-parse HEAD)
          after_tags=$(git tag --list | sort)

          git push origin HEAD:main
          git push origin --tags

          if [[ "$before_commit" != "$after_commit" || "$before_tags" != "$after_tags" ]]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Prepare image tags
        id: image
        if: github.event_name == 'push' || steps.sync.outputs.changed == 'true'
        shell: bash
        run: |
          sha=$(git rev-parse --short=12 HEAD)
          {
            echo "tags<<EOF"
            echo "${IMAGE}:latest"
            echo "${IMAGE}:sha-${sha}"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3
        if: github.event_name == 'push' || steps.sync.outputs.changed == 'true'

      - uses: docker/login-action@v3
        if: github.event_name == 'push' || steps.sync.outputs.changed == 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        if: github.event_name == 'push' || steps.sync.outputs.changed == 'true'
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.image.outputs.tags }}
