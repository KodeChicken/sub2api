name: Sync upstream release and publish fork release

on:
  push:
    branches:
      - main
  schedule:
    - cron: "23 */2 * * *"
  workflow_dispatch:

permissions:
  actions: write
  contents: write

concurrency:
  group: sync-upstream-main
  cancel-in-progress: false

jobs:
  sync-and-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - name: Sync latest upstream release and create fork tag
        id: release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add upstream https://github.com/Wei-Shaw/sub2api.git
          git pull --ff-only origin main

          upstream_tag=$(gh api repos/Wei-Shaw/sub2api/releases/latest --jq .tag_name)
          if [[ ! "$upstream_tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid upstream release tag: $upstream_tag" >&2
            exit 1
          fi

          git fetch upstream "refs/tags/$upstream_tag:refs/tags/$upstream_tag"
          git merge --no-edit "$upstream_tag"
          base_version=${upstream_tag#v}

          fork_tag=$(git tag --points-at HEAD --list "v${base_version}-kc.[0-9]*" --sort=-v:refname | head -n1)
          if [[ -z "$fork_tag" ]]; then
            max_revision=0
            while IFS= read -r tag; do
              revision=${tag##*.}
              if [[ "$revision" =~ ^[0-9]+$ ]] && (( revision > max_revision )); then
                max_revision=$revision
              fi
            done < <(git tag --list "v${base_version}-kc.*")

            fork_tag="v${base_version}-kc.$((max_revision + 1))"
            printf '%s\n' "${fork_tag#v}" > backend/cmd/server/VERSION
            git add backend/cmd/server/VERSION
            if ! git diff --cached --quiet; then
              git commit -m "chore: release $fork_tag [skip ci]"
            fi
            git tag -a "$fork_tag" -m "Fork release $fork_tag based on upstream $upstream_tag"
            git push --atomic origin HEAD:main "refs/tags/$fork_tag"
          else
            echo "HEAD is already tagged as $fork_tag"
          fi

          echo "tag=$fork_tag" >> "$GITHUB_OUTPUT"
          if gh release view "$fork_tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish fork release
        if: steps.release.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FORK_TAG: ${{ steps.release.outputs.tag }}
        run: |
          gh workflow run release.yml \
            --repo "$GITHUB_REPOSITORY" \
            --ref main \
            -f tag="$FORK_TAG" \
            -f source_ref="$FORK_TAG" \
            -f simple_release=false
